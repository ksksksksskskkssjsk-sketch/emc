name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find project
        run: |
          set -e
          if [ -f build.gradle ]; then
            PROJ=.
          else
            best=""; bt=-1
            while IFS= read -r -d '' f; do
              t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || true); t=${t:-0}
              if [ "$t" -ge "$bt" ]; then bt=$t; best="$f"; fi
            done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' -not -path './_proj/*' -print0)
            [ -n "$best" ] || { echo "No build.gradle and no .zip found in the repo"; exit 1; }
            echo "Using zip: $best"
            rm -rf _proj && mkdir _proj
            unzip -q "$best" -d _proj
            g=$(find _proj -name build.gradle | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
            [ -n "$g" ] || { echo "No build.gradle inside the zip"; exit 1; }
            PROJ=$(dirname "$g")
          fi
          echo "Project folder: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build (tries two mapping setups)
        run: |
          cd "$PROJ"
          ok=0
          gradle build --stacktrace -PmapMode=layered > "$GITHUB_WORKSPACE/log-layered.txt" 2>&1 && ok=1
          if [ "$ok" = 0 ]; then
            gradle clean build --stacktrace -PmapMode=intermediary > "$GITHUB_WORKSPACE/log-intermediary.txt" 2>&1 && ok=1
          fi
          echo "BUILD_OK=$ok" >> "$GITHUB_ENV"

      - name: Show errors
        if: always()
        run: |
          {
            if [ "$BUILD_OK" = 1 ]; then echo "## Build SUCCESS"; else echo "## Build FAILED"; fi
            for f in log-layered.txt log-intermediary.txt; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              grep -E "error:|What went wrong|Could not|cannot find symbol|symbol:|location:" -A2 "$f" | head -120 || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: log-*.txt
          if-no-files-found: ignore

      - name: Stop here if the build failed
        run: '[ "$BUILD_OK" = 1 ]'

      - name: Pick the mod jar
        run: |
          JAR=$(ls "$PROJ"/build/libs/*.jar | grep -v -- '-sources' | head -n1)
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: uemc-jar
          path: ${{ env.JAR }}

      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$JAR" \
            --title "Universal EMC build ${{ github.run_number }}" \
            --notes "Put this jar in your mods folder. Needs Fabric Loader + Fabric API for Minecraft 1.21.11." \
            --latest
