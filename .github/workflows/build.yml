
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q "$(ls *.zip | head -n1)" -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build (tries two mapping setups)
        working-directory: project
        run: |
          gradle build --stacktrace -PmapMode=intermediary \
          || gradle build --stacktrace -PmapMode=layered

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: uemc-jar
          path: project/build/libs/*.jar
